<text x="12" y="246" class="label">Putting the head together</text>
<text x="12" y="252.0" class="small">1. Solder the 4 brass nuts inside the screen ring's corners (line them up through this sheet), then the ring</text>
<text x="12" y="257.0" class="small">   inside the FRONT bezel ring ① with the 4 spokes. Screen in LAST: 4 nylon screws through its corners into the nuts.</text>
<text x="12" y="262.0" class="small">2. Join the front and middle bezel rings with 4 straight struts (14 mm) at the corners.</text>
<text x="12" y="267.0" class="small">3. Join the middle ring to the back ring ④ with 4 slanted struts: 64 mm at the top, 56 mm at the bottom.</text>
<text x="12" y="272.0" class="small">4. Solder the head axle across the floor, about a third of the way back, where the head balances.</text>
<text x="12" y="277.0" class="small">5. Stand the webcam cradle ② on top of the front ring, in the middle.</text>
  <text x="12" y="284" class="warn">Measure your REAL screen board and parts before cutting. Change the sizes in docs/frame/make_template.py and print again.</text>
  <text x="12" y="289" class="small">Leave the tube ~10 mm longer than the cut list and trim after bending. Brass conducts: keep bare wires and boards off it (heat-shrink, nylon standoffs).</text>
