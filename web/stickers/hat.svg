<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="880" height="840">
  <!-- Riley's Santa hat. Drawn upright; the face code tilts it. Source for hat.png (see make_stickers.py). -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a68"/>
      <stop offset="0.45" stop-color="#e02639"/>
      <stop offset="1" stop-color="#9c1022"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a0c1c"/>
      <stop offset="1" stop-color="#b8182b"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#c9ced8"/>
    </linearGradient>
    <radialGradient id="pom" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#bfc5d0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- the red cone: rises from the band, over the crown, and flops down to the right -->
  <clipPath id="cone"><path d="M 58 280 C 70 170, 120 60, 215 38 C 300 20, 360 80, 382 170 C 392 215, 388 270, 372 330
           C 362 305, 352 285, 346 272 L 340 286 Z"/></clipPath>
  <path d="M 58 280 C 70 170, 120 60, 215 38 C 300 20, 360 80, 382 170 C 392 215, 388 270, 372 330
           C 362 305, 352 285, 346 272 L 340 286 Z" fill="url(#red)"/>
  <!-- the fold where the tip droops over: a darker crease -->
  <g clip-path="url(#cone)">
    <path d="M 296 110 C 330 150, 348 200, 352 250 C 358 280, 366 305, 372 330 C 352 300, 336 262, 322 230
             C 314 190, 306 150, 296 110 Z" fill="url(#fold)" opacity="0.9"/>
  <!-- soft shine on the crown -->
  <ellipse cx="170" cy="110" rx="70" ry="40" fill="url(#shine)" transform="rotate(-25 170 110)"/>
  <!-- a little shadow the fur band casts on the red -->
    <path d="M 50 268 C 150 248, 260 240, 330 244 Q 342 266 330 290 L 50 290 Z" fill="#6e0814" opacity="0.5" filter="url(#soft)"/>
  </g>
  <!-- the fluffy white band -->
  <path d="M 36 262 A 16 12.8 0 0 1 64.0 264.0 A 16 12.8 0 0 1 92.0 262.0 A 16 12.8 0 0 1 120.0 264.0 A 16 12.8 0 0 1 148.0 262.0 A 16 12.8 0 0 1 176.0 264.0 A 16 12.8 0 0 1 204.0 262.0 A 16 12.8 0 0 1 232.0 264.0 A 16 12.8 0 0 1 260.0 262.0 A 16 12.8 0 0 1 288.0 264.0 A 16 12.8 0 0 1 316.0 262.0 A 16 12.8 0 0 1 344.0 264.0 A 22 36.0 0 0 1 344 334 A 16 12.8 0 0 1 316.0 332.0 A 16 12.8 0 0 1 288.0 334.0 A 16 12.8 0 0 1 260.0 332.0 A 16 12.8 0 0 1 232.0 334.0 A 16 12.8 0 0 1 204.0 332.0 A 16 12.8 0 0 1 176.0 334.0 A 16 12.8 0 0 1 148.0 332.0 A 16 12.8 0 0 1 120.0 334.0 A 16 12.8 0 0 1 92.0 332.0 A 16 12.8 0 0 1 64.0 334.0 A 16 12.8 0 0 1 36.0 332.0 A 22 36.0 0 0 1 36 262 Z" fill="url(#fur)"/>
  <path d="M 60 300 C 140 292, 250 290, 320 296" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" fill="none"/>
  <!-- the pom-pom -->
  <path d="M 416.0 360.0 A 13.2 13.2 0 0 1 411.6 379.1 A 13.2 13.2 0 0 1 399.4 394.4 A 13.2 13.2 0 0 1 381.8 402.9 A 13.2 13.2 0 0 1 362.2 402.9 A 13.2 13.2 0 0 1 344.6 394.4 A 13.2 13.2 0 0 1 332.4 379.1 A 13.2 13.2 0 0 1 328.0 360.0 A 13.2 13.2 0 0 1 332.4 340.9 A 13.2 13.2 0 0 1 344.6 325.6 A 13.2 13.2 0 0 1 362.2 317.1 A 13.2 13.2 0 0 1 381.8 317.1 A 13.2 13.2 0 0 1 399.4 325.6 A 13.2 13.2 0 0 1 411.6 340.9 A 13.2 13.2 0 0 1 416.0 360.0 Z" fill="url(#pom)"/>
  <ellipse cx="358" cy="343" rx="13" ry="9" fill="#ffffff" opacity="0.9"/>
</svg>