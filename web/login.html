<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolt Login</title>
<style>
  :root { --bg:#f4f1ea; --card:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --accent:#2f5d50; --accent-ink:#ffffff; --bad:#b0412e; --line:#dcd6ca; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#161513; --card:#201f1c; --ink:#ece8e1; --muted:#9a948a; --accent:#3f7a69; --accent-ink:#ffffff; --bad:#e08a78; --line:#34312c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg:#161513; --card:#201f1c; --ink:#ece8e1; --muted:#9a948a; --accent:#3f7a69; --accent-ink:#ffffff; --bad:#e08a78; --line:#34312c; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif;
         padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  main { width:100%; max-width:360px; display:grid; gap:18px; justify-items:center; text-align:center; }
  .eyes { display:flex; gap:10px; }
  .eyes canvas { width:160px; height:120px; border-radius:8px; box-shadow: 0 0 0 4px #b08a3e; }
  h1 { margin:0; font-size:22px; }
  p { margin:0; color:var(--muted); }
  form { width:100%; display:grid; gap:10px; }
  input { font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  button { font:inherit; font-weight:600; padding:12px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:disabled { opacity:.6; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #message { min-height:1.5em; color:var(--bad); font-size:14px; }
  .setup { width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; gap:8px; }
  code { display:block; padding:10px; border-radius:8px; background:var(--bg); font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; user-select:all; }
</style>
</head>
<body>
<main>
  <div class="eyes" aria-hidden="true">
    <canvas id="face" width="320" height="240"></canvas>
  </div>
  <h1>Bolt is locked</h1>

  <form id="login" hidden>
    <label for="password" style="position:absolute;left:-9999px">Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button id="go">Unlock</button>
    <div id="message" role="alert"></div>
  </form>

  <div class="setup" id="setup" hidden>
    <strong>Bolt doesn't have a password yet.</strong>
    <p>Until it has one, it won't do anything. On the mini PC, run:</p>
    <code>docker exec -it bolt python -m robot_friend.security set-password</code>
    <p>Then refresh this page.</p>
  </div>
</main>

<script src="/static/face.js"></script>
<script src="/static/name.js"></script>
<script>
let eyes = null;
fetch("/static/expressions.json").then((r) => r.json()).then((config) => {
  eyes = new BoltFace.Face(document.getElementById("face"), config);
  eyes.setState("sleeping");
}).catch(() => {});

// Only go back to pages on this site (a link can't send you somewhere else after logging in).
const next = new URLSearchParams(location.search).get("next");
const destination = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";

fetch("/login/status").then((r) => r.json()).then((s) => {
  if (s.logged_in) return location.replace(destination);
  document.getElementById(s.has_password ? "login" : "setup").hidden = false;
});

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), message = document.getElementById("message");
  go.disabled = true; message.textContent = "";
  try {
    const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ password: document.getElementById("password").value }) });
    const data = await r.json();
    if (r.ok) {
      if (eyes) eyes.setState("happy");
      setTimeout(() => location.replace(destination), 500);
      return;
    }
    message.textContent = data.error || "That didn't work.";
    if (eyes) eyes.setState("confused");
  } catch (err) {
    message.textContent = "Can't reach Bolt. Is the mini PC on?";
  }
  go.disabled = false;
});
</script>
</body>
</html>
