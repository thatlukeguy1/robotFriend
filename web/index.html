<!doctype html>
<!--
  LESSON: This page is a CLIENT: a program that sends requests to the server.
  The JavaScript at the bottom does exactly what the Pi will do later:
    * POST what you typed to /chat, and show the reply
    * ask /notifications every 10 seconds for reminders that went off
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolt</title>
<style>
  :root { --bg:#f4f1ea; --card:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --me:#2f5d50; --me-ink:#ffffff; --bolt:#ece6da; --alert:#b5651d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#201f1c; --ink:#ece8e1; --muted:#9a948a; --me:#3f7a69; --me-ink:#ffffff; --bolt:#2b2925; --alert:#e0954f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .eyes { display:flex; gap:6px; }
  .eyes canvas { width:48px; height:36px; border-radius:5px; display:block; box-shadow: 0 0 0 2px #b08a3e; }
  a.eyes:focus-visible { outline:2px solid var(--me); outline-offset:3px; border-radius:20px; }
  h1 { font-size:18px; margin:0; flex:1; }
  .reset { background:none; border:1px solid var(--muted); color:var(--muted); border-radius:8px; padding:6px 10px; font:inherit; font-size:14px; text-decoration:none; line-height:1.4; white-space:nowrap; }
  h1 { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Narrow phones: tighter header so Bolt's name still fits */
  @media (max-width: 440px) {
    header { gap:8px; padding-left:12px; padding-right:12px; }
    .eyes canvas { width:40px; height:30px; }
    .eyes { gap:4px; }
    .reset { padding:5px 7px; }
    .wide-only { display:none; }
    h1 { font-size:17px; }
  }
  #log { flex:1; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--me); color:var(--me-ink); border-bottom-right-radius:4px; }
  .bolt { align-self:flex-start; background:var(--bolt); border-bottom-left-radius:4px; }
  .alert { align-self:center; color:var(--alert); font-weight:600; }
  .error { align-self:center; color:var(--alert); font-size:14px; }
  form { display:flex; gap:8px; padding:12px 16px 16px; }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--muted);
          background:var(--card); color:var(--ink); font:inherit; }
  form button { padding:0 18px; border:0; border-radius:12px; background:var(--me); color:var(--me-ink); font:inherit; font-weight:600; }
  form button:disabled { opacity:.5; }
  #mic { padding:0 14px; background:var(--bolt); color:var(--ink); font-size:20px; touch-action:none; user-select:none; -webkit-user-select:none; }
  #mic.recording { background:var(--alert); color:#fff; }
  .heard { opacity:.75; font-style:italic; }
  .timings { font-style:normal; font-size:11px; opacity:.85; }
  #memories { display:none; margin:0 16px 8px; padding:12px; border-radius:12px; background:var(--card); border:1px solid var(--bolt); max-height:45dvh; overflow-y:auto; }
  #memories.open { display:block; }
  #memories h2 { font-size:15px; margin:0 0 4px; }
  #memories p { margin:0 0 8px; font-size:13px; color:var(--muted); }
  #memories ul { list-style:none; margin:0; padding:0; }
  #memories li { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--bolt); font-size:14px; }
  #memories li span { flex:1; overflow-wrap:anywhere; }
  #memories li small { color:var(--muted); display:block; }
  #memories li button { background:none; border:0; color:var(--muted); font-size:16px; padding:0 4px; }
</style>
</head>
<body>
<header>
  <a class="eyes" href="/studio" title="Open the Studio" aria-label="Bolt's eyes (opens the Studio)">
    <canvas id="face" width="96" height="72"></canvas>
  </a>
  <h1>Bolt</h1>
  <a class="reset" href="/studio" title="Studio: design Bolt's eyes and personality" aria-label="Open the Studio">🎨</a>
  <button class="reset" id="memory-button" aria-expanded="false" title="What Bolt remembers" aria-label="What Bolt remembers">🧠</button>
  <button class="reset" id="reset" aria-label="New chat">New<span class="wide-only"> chat</span></button>
  <button class="reset" data-logout title="Log out" aria-label="Log out">🔒</button>
</header>
<section id="memories" aria-label="What Bolt remembers">
  <h2>What Bolt remembers</h2>
  <p>Changes take effect from Bolt's next conversation.</p>
  <ul id="memory-list"></ul>
</section>
<div id="log"></div>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Say something to Bolt…" autofocus>
  <button id="mic" type="button" title="Hold to talk" aria-label="Hold to talk">🎤</button>
  <button id="send">Send</button>
</form>
<script src="/static/auth.js"></script>
<script src="/static/face.js"></script>
<script>
// ------------------------------------------------------------------
// BOLT'S FACE reacts to what's happening (see web/face.js).
// mood("thinking") changes expression; mood("happy", 1500) changes it
// for 1.5 seconds, then goes back to idle.
// ------------------------------------------------------------------
let eyes = null, moodTimer = null;
fetch("/static/expressions.json").then((r) => r.json()).then((config) => {
  BoltFace.fit(document.getElementById("face"));
  eyes = new BoltFace.Face(document.getElementById("face"), config);
}).catch(() => {});
// Show Bolt's current name (it can be changed in the Studio).
fetch("/personality").then((r) => r.json()).then((p) => {
  const name = p.current && p.current.name;
  if (name) { document.querySelector("header h1").textContent = name; document.title = name; }
}).catch(() => {});

function mood(state, ms) {
  clearTimeout(moodTimer);
  if (eyes) eyes.setState(state);
  if (ms) moodTimer = setTimeout(() => eyes && eyes.setState("idle"), ms);
}

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("text");
const send = document.getElementById("send");

function show(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// Send what you typed to the brain, and show what it says back.
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  show(text, "me");
  input.value = "";
  send.disabled = true;
  document.body.classList.add("thinking");
  mood("thinking");
  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await response.json();
    if (data.reply) { show(data.reply, "bolt"); mood("happy", 1500); }
    else { show("⚠ " + (data.error || "Something went wrong"), "error"); mood("confused", 2500); }
  } catch (err) {
    show("⚠ Can't reach Bolt's brain. Is the server running?", "error");
    mood("confused", 2500);
  }
  send.disabled = false;
  document.body.classList.remove("thinking");
  input.focus();
});

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/reset", { method: "POST" });
  log.innerHTML = "";
  show("Fresh conversation started.", "alert");
});

// ------------------------------------------------------------------
// LONG-TERM MEMORY: see everything Bolt remembers, and delete any of it.
// ------------------------------------------------------------------
const memoryPanel = document.getElementById("memories");
const memoryList = document.getElementById("memory-list");
const memoryButton = document.getElementById("memory-button");

async function loadMemories() {
  const { memories } = await (await fetch("/memories")).json();
  memoryList.innerHTML = "";
  if (!memories.length) {
    memoryList.innerHTML = "<li><span>Nothing yet. Tell Bolt something worth remembering!</span></li>";
  }
  for (const m of memories) {
    const li = document.createElement("li");
    const text = document.createElement("span");
    text.textContent = m.text;
    const when = document.createElement("small");
    when.textContent = "saved " + m.saved;
    text.appendChild(when);
    const del = document.createElement("button");
    del.textContent = "✕"; del.title = "Forget this"; del.setAttribute("aria-label", "Forget: " + m.text);
    del.addEventListener("click", async () => {
      await fetch("/memories/" + m.id, { method: "DELETE" });
      loadMemories();
    });
    li.append(text, del);
    memoryList.appendChild(li);
  }
}

memoryButton.addEventListener("click", () => {
  const open = memoryPanel.classList.toggle("open");
  memoryButton.setAttribute("aria-expanded", open);
  if (open) loadMemories();
});

// ------------------------------------------------------------------
// HOLD TO TALK
// While the 🎤 button is held, we collect raw samples from the microphone.
// On release we shrink them to 16,000 samples a second (what Whisper likes),
// wrap them in a WAV header and POST them to /voice. Bolt answers with
// text AND audio, which we play through the same AudioContext.
// ------------------------------------------------------------------
const mic = document.getElementById("mic");
let audioCtx = null, stream = null, recorder = null, samples = [];

if (!window.isSecureContext || !navigator.mediaDevices) {
  // Browsers only allow the microphone on https:// pages (or localhost).
  mic.addEventListener("click", () => show(
    "🎤 Your browser blocks the microphone on plain http:// pages. In Chrome, add exactly " +
    location.origin + " to chrome://flags/#unsafely-treat-insecure-origin-as-secure (see LEARN.md).", "error"));
} else {
  mic.addEventListener("pointerdown", startRecording);
  mic.addEventListener("pointerup", stopRecording);
  mic.addEventListener("pointerleave", stopRecording);
  mic.addEventListener("pointercancel", stopRecording);
}

async function startRecording(event) {
  event.preventDefault();
  if (recorder) return;
  try {
    audioCtx = audioCtx || new AudioContext();
    await audioCtx.resume();  // must happen during a tap, or phones stay silent
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (err) {
    show("🎤 I couldn't use the microphone: " + err.message, "error");
    return;
  }
  samples = [];
  const source = audioCtx.createMediaStreamSource(stream);
  recorder = audioCtx.createScriptProcessor(4096, 1, 1);
  recorder.onaudioprocess = (e) => samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(recorder);
  recorder.connect(audioCtx.destination);
  recorder.source = source;
  mic.classList.add("recording");
  mood("listening");
}

async function stopRecording() {
  if (!recorder) return;
  recorder.disconnect(); recorder.source.disconnect(); recorder = null;
  mic.classList.remove("recording");
  const seconds = samples.reduce((n, s) => n + s.length, 0) / audioCtx.sampleRate;
  if (seconds < 0.4) { show("Hold the 🎤 button while you talk.", "error"); mood("confused", 1500); return; }

  const wav = makeWav(downsample(samples, audioCtx.sampleRate, 16000), 16000);
  const heardBubble = document.createElement("div");
  heardBubble.className = "msg me heard"; heardBubble.textContent = "🎤 …";
  log.appendChild(heardBubble); log.scrollTop = log.scrollHeight;
  document.body.classList.add("thinking"); mic.disabled = true; mood("thinking");
  try {
    const data = await (await fetch("/voice", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav })).json();
    heardBubble.textContent = "🎤 " + (data.transcript || "(nothing heard)");
    if (data.timings) {   // how long each step took (see "Measure before you speed things up" in server.py)
      const t = data.timings, parts = [];
      if (t.recording != null) parts.push(`${t.recording}s recording`);
      if (t.listening != null) parts.push(`heard in ${t.listening}s`);
      if (t.thinking != null) parts.push(`thought ${t.thinking}s`);
      if (t.speaking != null) parts.push(`voiced ${t.speaking}s`);
      const note = document.createElement("small");
      note.className = "timings"; note.textContent = parts.join(" · ");
      heardBubble.appendChild(document.createElement("br")); heardBubble.appendChild(note);
    }
    if (data.reply) show(data.reply, "bolt");
    if (data.error) { show("⚠ " + data.error, "error"); mood("confused", 2500); }
    if (data.audio) await play(data.audio);
    else if (data.reply) mood("happy", 1500);
  } catch (err) {
    heardBubble.remove();
    show("⚠ Can't reach Bolt's brain. Is the server running?", "error");
    mood("confused", 2500);
  }
  document.body.classList.remove("thinking"); mic.disabled = false;
}

// Join the slices together and keep one sample out of every few.
function downsample(chunks, fromRate, toRate) {
  const all = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
  let offset = 0;
  for (const c of chunks) { all.set(c, offset); offset += c.length; }
  const ratio = fromRate / toRate, out = new Float32Array(Math.floor(all.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
    let sum = 0; for (let j = start; j < end; j++) sum += all[j];  // average = smoother sound
    out[i] = sum / Math.max(1, end - start);
  }
  return out;
}

// A WAV file = a 44-byte header describing the audio + the samples as 16-bit numbers.
function makeWav(floats, rate) {
  const buf = new ArrayBuffer(44 + floats.length * 2), v = new DataView(buf);
  const text = (o, t) => [...t].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  text(0, "RIFF"); v.setUint32(4, 36 + floats.length * 2, true); text(8, "WAVE");
  text(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  text(36, "data"); v.setUint32(40, floats.length * 2, true);
  floats.forEach((f, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, f)) * 0x7fff, true));
  return buf;
}

// Play Bolt's reply. An ANALYSER measures how loud each moment is, so the
// eyes can bob along with the voice.
async function play(base64) {
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  const sound = await audioCtx.decodeAudioData(bytes.buffer);
  const player = audioCtx.createBufferSource();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  player.buffer = sound;
  player.connect(analyser); analyser.connect(audioCtx.destination);
  const samples = new Float32Array(analyser.fftSize);
  let playing = true;
  (function measure() {
    if (!playing) return;
    analyser.getFloatTimeDomainData(samples);
    let sum = 0; for (const v of samples) sum += v * v;
    if (eyes) eyes.setLevel(Math.min(1, Math.sqrt(sum / samples.length) * 6));
    requestAnimationFrame(measure);
  })();
  mood("speaking");
  await new Promise((done) => { player.onended = done; player.start(); });
  playing = false;
  if (eyes) eyes.setLevel(0);
  mood("happy", 1200);
}

// Every 10 seconds, ask "any reminders gone off since the last one I saw?"
let lastSeen = null;
async function checkReminders() {
  try {
    const firstLoad = lastSeen === null;  // skip reminders from before the page opened
    const data = await (await fetch("/notifications?after=" + (lastSeen ?? 0))).json();
    let newest = lastSeen ?? 0;
    for (const n of data.notifications) {
      if (!firstLoad) show("🔔 " + n.text, "alert");
      newest = Math.max(newest, n.id);
    }
    lastSeen = newest;
  } catch (err) { /* server not reachable right now; try again soon */ }
}
checkReminders();
setInterval(checkReminders, 10000);
</script>
</body>
</html>
