<!doctype html>
<!--
  LESSON: This page is a CLIENT: a program that sends requests to the server.
  The JavaScript at the bottom does exactly what the Pi will do later:
    * POST what you typed to /chat, and show the reply
    * ask /notifications every 10 seconds for reminders that went off
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolt</title>
<style>
  :root { --bg:#f4f1ea; --card:#ffffff; --ink:#1f1d1a; --muted:#6b665e; --me:#2f5d50; --me-ink:#ffffff; --bolt:#ece6da; --alert:#b5651d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#201f1c; --ink:#ece8e1; --muted:#9a948a; --me:#3f7a69; --me-ink:#ffffff; --bolt:#2b2925; --alert:#e0954f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .eyes { display:flex; gap:6px; }
  .eye { width:14px; height:14px; border-radius:50%; background:var(--me); transition:transform .2s; }
  body.thinking .eye { animation: blink 1s infinite; }
  @keyframes blink { 0%,90%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
  h1 { font-size:18px; margin:0; flex:1; }
  button.reset { background:none; border:1px solid var(--muted); color:var(--muted); border-radius:8px; padding:6px 10px; font:inherit; font-size:14px; }
  #log { flex:1; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--me); color:var(--me-ink); border-bottom-right-radius:4px; }
  .bolt { align-self:flex-start; background:var(--bolt); border-bottom-left-radius:4px; }
  .alert { align-self:center; color:var(--alert); font-weight:600; }
  .error { align-self:center; color:var(--alert); font-size:14px; }
  form { display:flex; gap:8px; padding:12px 16px 16px; }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--muted);
          background:var(--card); color:var(--ink); font:inherit; }
  form button { padding:0 18px; border:0; border-radius:12px; background:var(--me); color:var(--me-ink); font:inherit; font-weight:600; }
  form button:disabled { opacity:.5; }
  #mic { padding:0 14px; background:var(--bolt); color:var(--ink); font-size:20px; touch-action:none; user-select:none; -webkit-user-select:none; }
  #mic.recording { background:var(--alert); color:#fff; }
  .heard { opacity:.75; font-style:italic; }
</style>
</head>
<body>
<header>
  <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
  <h1>Bolt</h1>
  <button class="reset" id="reset">New chat</button>
</header>
<div id="log"></div>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Say something to Bolt…" autofocus>
  <button id="mic" type="button" title="Hold to talk" aria-label="Hold to talk">🎤</button>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("text");
const send = document.getElementById("send");

function show(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// Send what you typed to the brain, and show what it says back.
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  show(text, "me");
  input.value = "";
  send.disabled = true;
  document.body.classList.add("thinking");
  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await response.json();
    if (data.reply) show(data.reply, "bolt");
    else show("⚠ " + (data.error || "Something went wrong"), "error");
  } catch (err) {
    show("⚠ Can't reach Bolt's brain. Is the server running?", "error");
  }
  send.disabled = false;
  document.body.classList.remove("thinking");
  input.focus();
});

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/reset", { method: "POST" });
  log.innerHTML = "";
  show("Fresh conversation started.", "alert");
});

// ------------------------------------------------------------------
// HOLD TO TALK
// While the 🎤 button is held, we collect raw samples from the microphone.
// On release we shrink them to 16,000 samples a second (what Whisper likes),
// wrap them in a WAV header and POST them to /voice. Bolt answers with
// text AND audio, which we play through the same AudioContext.
// ------------------------------------------------------------------
const mic = document.getElementById("mic");
let audioCtx = null, stream = null, recorder = null, samples = [];

if (!window.isSecureContext || !navigator.mediaDevices) {
  // Browsers only allow the microphone on https:// pages (or localhost).
  mic.addEventListener("click", () => show(
    "🎤 Your browser blocks the microphone on plain http:// pages. In Chrome, add exactly " +
    location.origin + " to chrome://flags/#unsafely-treat-insecure-origin-as-secure (see LEARN.md).", "error"));
} else {
  mic.addEventListener("pointerdown", startRecording);
  mic.addEventListener("pointerup", stopRecording);
  mic.addEventListener("pointerleave", stopRecording);
  mic.addEventListener("pointercancel", stopRecording);
}

async function startRecording(event) {
  event.preventDefault();
  if (recorder) return;
  try {
    audioCtx = audioCtx || new AudioContext();
    await audioCtx.resume();  // must happen during a tap, or phones stay silent
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (err) {
    show("🎤 I couldn't use the microphone: " + err.message, "error");
    return;
  }
  samples = [];
  const source = audioCtx.createMediaStreamSource(stream);
  recorder = audioCtx.createScriptProcessor(4096, 1, 1);
  recorder.onaudioprocess = (e) => samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(recorder);
  recorder.connect(audioCtx.destination);
  recorder.source = source;
  mic.classList.add("recording");
}

async function stopRecording() {
  if (!recorder) return;
  recorder.disconnect(); recorder.source.disconnect(); recorder = null;
  mic.classList.remove("recording");
  const seconds = samples.reduce((n, s) => n + s.length, 0) / audioCtx.sampleRate;
  if (seconds < 0.4) { show("Hold the 🎤 button while you talk.", "error"); return; }

  const wav = makeWav(downsample(samples, audioCtx.sampleRate, 16000), 16000);
  const heardBubble = document.createElement("div");
  heardBubble.className = "msg me heard"; heardBubble.textContent = "🎤 …";
  log.appendChild(heardBubble); log.scrollTop = log.scrollHeight;
  document.body.classList.add("thinking"); mic.disabled = true;
  try {
    const data = await (await fetch("/voice", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav })).json();
    heardBubble.textContent = "🎤 " + (data.transcript || "(nothing heard)");
    if (data.reply) show(data.reply, "bolt");
    if (data.error) show("⚠ " + data.error, "error");
    if (data.audio) await play(data.audio);
  } catch (err) {
    heardBubble.remove();
    show("⚠ Can't reach Bolt's brain. Is the server running?", "error");
  }
  document.body.classList.remove("thinking"); mic.disabled = false;
}

// Join the slices together and keep one sample out of every few.
function downsample(chunks, fromRate, toRate) {
  const all = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
  let offset = 0;
  for (const c of chunks) { all.set(c, offset); offset += c.length; }
  const ratio = fromRate / toRate, out = new Float32Array(Math.floor(all.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
    let sum = 0; for (let j = start; j < end; j++) sum += all[j];  // average = smoother sound
    out[i] = sum / Math.max(1, end - start);
  }
  return out;
}

// A WAV file = a 44-byte header describing the audio + the samples as 16-bit numbers.
function makeWav(floats, rate) {
  const buf = new ArrayBuffer(44 + floats.length * 2), v = new DataView(buf);
  const text = (o, t) => [...t].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  text(0, "RIFF"); v.setUint32(4, 36 + floats.length * 2, true); text(8, "WAVE");
  text(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  text(36, "data"); v.setUint32(40, floats.length * 2, true);
  floats.forEach((f, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, f)) * 0x7fff, true));
  return buf;
}

async function play(base64) {
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  const sound = await audioCtx.decodeAudioData(bytes.buffer);
  const player = audioCtx.createBufferSource();
  player.buffer = sound; player.connect(audioCtx.destination); player.start();
}

// Every 10 seconds, ask "any reminders gone off since the last one I saw?"
let lastSeen = null;
async function checkReminders() {
  try {
    const firstLoad = lastSeen === null;  // skip reminders from before the page opened
    const data = await (await fetch("/notifications?after=" + (lastSeen ?? 0))).json();
    let newest = lastSeen ?? 0;
    for (const n of data.notifications) {
      if (!firstLoad) show("🔔 " + n.text, "alert");
      newest = Math.max(newest, n.id);
    }
    lastSeen = newest;
  } catch (err) { /* server not reachable right now; try again soon */ }
}
checkReminders();
setInterval(checkReminders, 10000);
</script>
</body>
</html>
